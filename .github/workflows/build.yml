name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Fix gradlew line endings and permissions
      run: |
        dos2unix gradlew 2>/dev/null || sed -i 's/\r$//' gradlew
        chmod +x gradlew
      shell: bash
      
    - name: Check Gradle Wrapper
      run: |
        ls -la gradle/wrapper/ || echo "Gradle wrapper directory not found"
        ls -la gradle/wrapper/*.jar || echo "Gradle wrapper JAR not found"
      shell: bash
      continue-on-error: true
      
    - name: Generate Gradle Wrapper (if missing)
      run: |
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "Generating Gradle wrapper..."
          gradle wrapper --gradle-version 8.2
        fi
      shell: bash
      continue-on-error: true
      
    - name: Build APK
      run: |
        ./gradlew clean
        ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log || true
      shell: bash
      
    - name: Check build status
      run: |
        if grep -q "BUILD FAILED" build.log; then
          echo "BUILD_FAILED=true" >> $GITHUB_ENV
        else
          echo "BUILD_FAILED=false" >> $GITHUB_ENV
        fi
      shell: bash
      
    - name: Show build errors
      if: env.BUILD_FAILED == 'true'
      run: |
        echo "=== Kotlin Compilation Errors ==="
        grep -B 5 -A 20 "e:" build.log | head -100 || echo "No 'e:' errors found"
        echo ""
        echo "=== Unresolved Reference Errors ==="
        grep -B 3 -A 10 "Unresolved reference" build.log | head -50 || echo "No unresolved reference errors"
        echo ""
        echo "=== Type Mismatch Errors ==="
        grep -B 3 -A 10 "Type mismatch" build.log | head -50 || echo "No type mismatch errors"
        echo ""
        echo "=== CompileDebugKotlin Section ==="
        awk '/:app:compileDebugKotlin/,/FAILED|SUCCESS/' build.log | head -300 || echo "No compileDebugKotlin section"
        echo ""
        echo "=== Full Build Log (Last 500 lines) ==="
        tail -500 build.log
      shell: bash
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: warn

