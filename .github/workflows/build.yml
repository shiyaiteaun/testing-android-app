name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Fix gradlew line endings and permissions
      run: |
        dos2unix gradlew 2>/dev/null || sed -i 's/\r$//' gradlew
        chmod +x gradlew
      shell: bash
      
    - name: Check Gradle Wrapper
      run: |
        ls -la gradle/wrapper/ || echo "Gradle wrapper directory not found"
        ls -la gradle/wrapper/*.jar || echo "Gradle wrapper JAR not found"
      shell: bash
      continue-on-error: true
      
    - name: Generate Gradle Wrapper (if missing)
      run: |
        if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
          echo "Generating Gradle wrapper..."
          gradle wrapper --gradle-version 8.2
        fi
      shell: bash
      continue-on-error: true
      
    - name: Build APK
      id: build
      run: |
        ./gradlew clean
        ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
        BUILD_EXIT_CODE=${PIPESTATUS[0]}
        if [ $BUILD_EXIT_CODE -eq 0 ]; then
          echo "BUILD_SUCCESS=true" >> $GITHUB_ENV
          echo "build_status=success" >> $GITHUB_OUTPUT
        else
          echo "BUILD_SUCCESS=false" >> $GITHUB_ENV
          echo "build_status=failed" >> $GITHUB_OUTPUT
        fi
        exit $BUILD_EXIT_CODE
      shell: bash
      continue-on-error: true
      
    - name: Check build status
      run: |
        echo "=== Build Status Summary ==="
        if grep -q "BUILD SUCCESSFUL" build.log; then
          echo "✓ BUILD SUCCESSFUL"
          echo "BUILD_FAILED=false" >> $GITHUB_ENV
        elif grep -q "BUILD FAILED" build.log; then
          echo "✗ BUILD FAILED"
          echo "BUILD_FAILED=true" >> $GITHUB_ENV
        else
          echo "⚠ Build status unclear - checking exit code"
          if [ "${{ env.BUILD_SUCCESS }}" != "true" ]; then
            echo "✗ Build likely failed (exit code check)"
            echo "BUILD_FAILED=true" >> $GITHUB_ENV
          else
            echo "? Build status unknown"
            echo "BUILD_FAILED=false" >> $GITHUB_ENV
          fi
        fi
        echo ""
        echo "BUILD_SUCCESS env: ${{ env.BUILD_SUCCESS }}"
        echo "BUILD_FAILED env: $BUILD_FAILED"
      shell: bash
      
    - name: Show build errors
      if: env.BUILD_FAILED == 'true'
      run: |
        echo "=========================================="
        echo "⚠ BUILD FAILED - Showing Error Details"
        echo "=========================================="
        echo ""
        echo "=== Kotlin Compilation Errors ==="
        grep -B 5 -A 20 "e:" build.log | head -100 || echo "No 'e:' errors found"
        echo ""
        echo "=== Unresolved Reference Errors ==="
        grep -B 3 -A 10 "Unresolved reference" build.log | head -50 || echo "No unresolved reference errors"
        echo ""
        echo "=== Type Mismatch Errors ==="
        grep -B 3 -A 10 "Type mismatch" build.log | head -50 || echo "No type mismatch errors"
        echo ""
        echo "=== CompileDebugKotlin Section ==="
        awk '/:app:compileDebugKotlin/,/FAILED|SUCCESS/' build.log | head -300 || echo "No compileDebugKotlin section"
        echo ""
        echo "=== Full Build Log (Last 500 lines) ==="
        tail -500 build.log
      shell: bash
    
    - name: Show build success message
      if: env.BUILD_FAILED != 'true' && env.BUILD_SUCCESS == 'true'
      run: |
        echo "=========================================="
        echo "✓ BUILD SUCCESSFUL"
        echo "=========================================="
        echo "The build completed successfully."
        echo "APK should be located at: app/build/outputs/apk/debug/app-debug.apk"
      shell: bash
      
    - name: Show build summary
      run: |
        echo "=== Build Summary ==="
        echo "Build Success: ${{ env.BUILD_SUCCESS }}"
        echo "Build Failed: ${{ env.BUILD_FAILED }}"
        echo ""
        if [ -f "build.log" ]; then
          echo "=== Last 20 lines of build.log ==="
          tail -20 build.log
          echo ""
          if grep -q "BUILD SUCCESSFUL" build.log; then
            echo "✓ Build completed successfully according to build.log"
          elif grep -q "BUILD FAILED" build.log; then
            echo "✗ Build failed according to build.log"
          fi
        fi
      shell: bash
      continue-on-error: true
    
    - name: Find and list APK files
      id: find_apk
      run: |
        echo "=== Searching for APK files ==="
        APK_FILES=$(find . -name "*.apk" -type f 2>/dev/null || true)
        if [ -z "$APK_FILES" ]; then
          echo "No APK files found"
          echo "apk_found=false" >> $GITHUB_OUTPUT
        else
          echo "Found APK files:"
          echo "$APK_FILES"
          echo "apk_found=true" >> $GITHUB_OUTPUT
          # Find the first APK file path
          FIRST_APK=$(echo "$APK_FILES" | head -n 1)
          echo "apk_path=$FIRST_APK" >> $GITHUB_OUTPUT
        fi
        echo ""
        echo "=== Checking app/build/outputs/apk ==="
        ls -la app/build/outputs/apk/ 2>/dev/null || echo "Directory does not exist"
        echo ""
        echo "=== Checking app/build/outputs/apk/debug ==="
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "Directory does not exist"
        echo ""
        echo "=== Checking if default APK path exists ==="
        if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
          echo "✓ Default APK path exists: app/build/outputs/apk/debug/app-debug.apk"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
        else
          echo "✗ Default APK path does not exist: app/build/outputs/apk/debug/app-debug.apk"
          echo ""
          echo "⚠ If build succeeded but APK not found, check:"
          echo "  1. Build logs for errors"
          echo "  2. app/build.gradle configuration"
          echo "  3. Android SDK setup"
        fi
      shell: bash
      continue-on-error: true
    
    - name: Upload APK
      if: steps.find_apk.outputs.apk_found == 'true' && env.BUILD_SUCCESS == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: ${{ steps.find_apk.outputs.apk_path }}
        if-no-files-found: error
        retention-days: 30

